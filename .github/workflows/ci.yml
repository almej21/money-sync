name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build -w frontend
