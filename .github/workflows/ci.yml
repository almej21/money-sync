name: CI

on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm install
      - run: npm install --workspaces
      - run: npm run build -w frontend
