name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: prod
      AWS_REGION: us-east-1
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate required backend deploy secrets
        run: |
          test -n "${{ secrets.MONGODB_URI }}" || { echo "Missing required secret: MONGODB_URI"; exit 1; }
          test -n "${{ secrets.JWT_SECRET }}" || { echo "Missing required secret: JWT_SECRET"; exit 1; }
          test -n "${{ secrets.JWT_EXPIRES_IN }}" || { echo "Missing required secret: JWT_EXPIRES_IN"; exit 1; }
          test -n "${{ secrets.CLIENT_URL }}" || { echo "Missing required secret: CLIENT_URL"; exit 1; }
          test -n "${{ secrets.BANK_CREDENTIALS_SECRET }}" || { echo "Missing required secret: BANK_CREDENTIALS_SECRET"; exit 1; }

      - name: Install backend runtime dependencies locally
        env:
          NPM_CONFIG_WORKSPACES: "false"
        run: npm install --omit=dev --workspaces=false

      - name: Verify packaged dependencies exist in backend
        run: |
          test -d node_modules/dotenv
          test -d node_modules/express

      - name: Recover stack if it is in a non-updatable state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          STACK_NAME="money-sync-api-${STAGE}"
          STACK_STATUS="$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].StackStatus" \
              --output text 2>/dev/null || true
          )"

          echo "Current CloudFormation status: ${STACK_STATUS:-<not-found>}"

          case "$STACK_STATUS" in
            DELETE_FAILED|ROLLBACK_COMPLETE|ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED|UPDATE_ROLLBACK_COMPLETE)
              echo "Stack is not updatable. Deleting stack before deploy..."
              aws cloudformation delete-stack --stack-name "$STACK_NAME"

              if aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"; then
                echo "Stack deleted successfully."
              else
                REMAINING_STATUS="$(
                  aws cloudformation describe-stacks \
                    --stack-name "$STACK_NAME" \
                    --query "Stacks[0].StackStatus" \
                    --output text 2>/dev/null || true
                )"

                if [ "$REMAINING_STATUS" = "DELETE_FAILED" ]; then
                  echo "Delete failed. Retrying with FORCE_DELETE_STACK..."
                  aws cloudformation delete-stack \
                    --stack-name "$STACK_NAME" \
                    --deletion-mode FORCE_DELETE_STACK
                  aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
                  echo "Stack force-deleted successfully."
                elif [ -n "$REMAINING_STATUS" ]; then
                  echo "Stack still exists after delete attempt: $REMAINING_STATUS"
                  exit 1
                else
                  echo "Stack not found after delete wait; continuing."
                fi
              fi
              ;;
            "")
              echo "Stack does not exist yet. Continuing."
              ;;
            *)
              echo "Stack is updatable. Continuing."
              ;;
          esac

      - run: npx serverless@3 deploy --stage "${STAGE}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          BANK_SCRAPER_ENABLED: "true"
          BANK_CREDENTIALS_SECRET: ${{ secrets.BANK_CREDENTIALS_SECRET }}
