service: money-sync-api
useDotenv: true
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  timeout: ${env:LAMBDA_TIMEOUT_SECONDS, 180}
  memorySize: ${env:LAMBDA_MEMORY_SIZE, 2048}
  environment:
    LAMBDA_TIMEOUT_SECONDS: ${env:LAMBDA_TIMEOUT_SECONDS, '180'}
    MONGODB_URI: ${env:MONGODB_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRES_IN: ${env:JWT_EXPIRES_IN}
    CLIENT_URL: ${env:CLIENT_URL}
    BANK_SCRAPER_ENABLED: ${env:BANK_SCRAPER_ENABLED, 'false'}
    BANK_CREDENTIALS_SECRET: ${env:BANK_CREDENTIALS_SECRET}
    BANK_SCRAPER_SHOW_BROWSER: ${env:BANK_SCRAPER_SHOW_BROWSER, 'false'}
    BANK_SCRAPER_VERBOSE: ${env:BANK_SCRAPER_VERBOSE, 'false'}
    BANK_SCRAPER_ALLOW_BROWSER_FALLBACK_IN_LAMBDA: ${env:BANK_SCRAPER_ALLOW_BROWSER_FALLBACK_IN_LAMBDA, 'true'}
    BANK_SCRAPE_ATTEMPT_TIMEOUT_MS: ${env:BANK_SCRAPE_ATTEMPT_TIMEOUT_MS, '30000'}
    BANK_SCRAPER_RETRY_DELAY_MS: ${env:BANK_SCRAPER_RETRY_DELAY_MS, '1500'}
    BANK_SYNC_TIMEOUT_MS: ${env:BANK_SYNC_TIMEOUT_MS, '25000'}
    BANK_SYNC_MIN_INTERVAL_MS: ${env:BANK_SYNC_MIN_INTERVAL_MS, '120000'}
    BANK_SYNC_LOCK_MS: ${env:BANK_SYNC_LOCK_MS, ''}
    BANK_DAILY_SYNC_ACTIVE_WINDOW_HOURS: ${env:BANK_DAILY_SYNC_ACTIVE_WINDOW_HOURS, '120'}
    BANK_DAILY_SYNC_CRON: ${env:BANK_DAILY_SYNC_CRON, 'cron(0 3 * * ? *)'}
    BANK_COMPANY_ID: ${env:BANK_COMPANY_ID, ''}
    BANK_USERNAME: ${env:BANK_USERNAME, ''}
    BANK_NATIONAL_ID: ${env:BANK_NATIONAL_ID, ''}
    BANK_PASSWORD: ${env:BANK_PASSWORD, ''}

functions:
  api:
    handler: src/lambda.handler
    timeout: 30
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
  dailyBankSync:
    handler: src/dailyBankSync.handler
    timeout: ${env:BANK_DAILY_SYNC_FUNCTION_TIMEOUT_SECONDS, 900}
    events:
      - schedule:
          rate: ${env:BANK_DAILY_SYNC_CRON, 'cron(0 3 * * ? *)'}

plugins: []
